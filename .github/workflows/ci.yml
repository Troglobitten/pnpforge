name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
      - name: Logic checks
        run: |
          npx tsx scripts/check-zones.mts 300
          npx tsx scripts/check-throws.mts
      - name: API smoke test
        run: |
          PNPFORGE_DATA=$RUNNER_TEMP/pnpforge-data npx tsx server/index.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3717/api/games >/dev/null && break
            sleep 1
          done
          node scripts/smoke.mjs

  image:
    # proves the Dockerfile still builds; publishing happens in release.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
